name: WhatsApp bridge

# Runs only when its folder changes: Actions minutes are billed per run.
on:
  push:
    branches: [main]
    paths:
      - "whatsapp/**"
      - ".github/workflows/whatsapp.yml"
  pull_request:
    branches: [main]
    paths:
      - "whatsapp/**"
      - ".github/workflows/whatsapp.yml"

jobs:
  whatsapp-bridge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: whatsapp
        run: npm ci --no-audit --no-fund

      - name: Tests
        working-directory: whatsapp
        run: npm test
