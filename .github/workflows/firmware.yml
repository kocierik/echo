name: Firmware

# Runs only when its folder changes: Actions minutes are billed per run.
on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

jobs:
  firmware-syntax:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PlatformIO
        run: pip install platformio

      - name: Check firmware compiles
        run: |
          cd firmware
          pio run --environment xiao_esp32s3

      - name: Firmware unit tests (native)
        run: |
          cd firmware
          pio test --environment native
