name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          cd backend
          ruff check app/ tests/

      - name: Unit tests
        run: |
          cd backend
          pytest tests/test_adpcm_decoder.py -v --noconftest

  firmware-syntax:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PlatformIO
        run: pip install platformio

      - name: Check firmware compiles
        run: |
          cd firmware
          pio run --environment xiao_esp32s3

  simulator-syntax:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check simulator syntax
        run: |
          python -m py_compile simulator/adpcm_encode.py
          python -m py_compile simulator/simulate_device.py
