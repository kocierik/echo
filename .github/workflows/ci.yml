name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: echo
          POSTGRES_PASSWORD: echo
          POSTGRES_DB: echo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          cd backend
          ruff check app/ tests/

      - name: Unit tests (no DB required)
        run: |
          cd backend
          pytest tests/test_adpcm_decoder.py tests/test_temporal.py tests/test_chunking.py tests/test_circuit_breaker.py -v --noconftest

      - name: Create the database with Alembic (empty database -> head)
        run: |
          cd backend
          alembic upgrade head
        env:
          DATABASE_URL: "postgresql+asyncpg://echo:echo@localhost:5432/echo_test"
          REDIS_URL: "redis://localhost:6379/0"
          OPENAI_API_KEY: "sk-test-not-real"
          AUDIO_STORAGE_PATH: "/tmp/echo_audio"

      - name: Integration tests (with DB + Redis)
        run: |
          cd backend
          pytest tests/ -v --timeout=30
        env:
          DATABASE_URL: "postgresql+asyncpg://echo:echo@localhost:5432/echo_test"
          REDIS_URL: "redis://localhost:6379/0"
          OPENAI_API_KEY: "sk-test-not-real"
          AUDIO_STORAGE_PATH: "/tmp/echo_audio"

  firmware-syntax:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PlatformIO
        run: pip install platformio

      - name: Check firmware compiles
        run: |
          cd firmware
          pio run --environment xiao_esp32s3

      - name: Firmware unit tests (native)
        run: |
          cd firmware
          pio test --environment native

  mobile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        working-directory: mobile
        run: flutter test

  simulator-syntax:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check simulator syntax
        run: |
          python -m py_compile simulator/adpcm_encode.py
          python -m py_compile simulator/simulate_device.py
