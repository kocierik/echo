name: Backend

# Runs only when its folder changes: Actions minutes are billed per run.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/schema.sql"  # test_migrations checks it against the models
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/schema.sql"  # test_migrations checks it against the models
      - ".github/workflows/backend.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: echo
          POSTGRES_PASSWORD: echo
          POSTGRES_DB: echo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus0
          cd backend
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          cd backend
          ruff check app/ tests/ evals/

      - name: Unit tests (no DB required)
        run: |
          cd backend
          pytest tests/test_adpcm_decoder.py tests/test_temporal.py tests/test_chunking.py tests/test_circuit_breaker.py -v --noconftest

      - name: Create the database with Alembic (empty database -> head)
        run: |
          cd backend
          alembic upgrade head
        env:
          DATABASE_URL: "postgresql+asyncpg://echo:echo@localhost:5432/echo_test"
          REDIS_URL: "redis://localhost:6379/0"
          OPENAI_API_KEY: "sk-test-not-real"
          AUDIO_STORAGE_PATH: "/tmp/echo_audio"

      - name: Integration tests (with DB + Redis)
        run: |
          cd backend
          pytest tests/ -v --timeout=30
        env:
          DATABASE_URL: "postgresql+asyncpg://echo:echo@localhost:5432/echo_test"
          REDIS_URL: "redis://localhost:6379/0"
          OPENAI_API_KEY: "sk-test-not-real"
          AUDIO_STORAGE_PATH: "/tmp/echo_audio"
