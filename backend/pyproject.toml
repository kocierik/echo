[project]
name = "echo-backend"
version = "0.1.0"
description = "Second Brain AI Wearable - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.31.1",  # the MCP SDK's floor
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.3",
    "pgvector==0.3.5",
    "redis==5.1.1",
    "pydantic-settings==2.5.2",
    "openai==2.54.0",
    "python-multipart==0.0.12",
    "httpx==0.27.2",
    "slowapi==0.1.9",
    "composio==0.22.0",
    "sherpa-onnx==1.13.8",  # voice fingerprints (speaker embeddings, ONNX on CPU)
    "tzdata==2025.2",  # IANA zones for zoneinfo on platforms without a system tz database
    "argon2-cffi==23.1.0",  # account passwords (Argon2id)
    # MCP server for connected apps; 2.x needs Starlette 1.x, which FastAPI 0.115 does not take
    "mcp==1.30.0",
    "sse-starlette==3.0.3",  # the newest that keeps Starlette 0.38
    "pypdf==6.21.4",  # documents: the text of a PDF
    "python-docx==1.2.0",  # documents: the text of a Word file
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-timeout==2.3.1",
    "ruff==0.6.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "tests*"]
