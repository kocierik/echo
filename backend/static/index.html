<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo — Second Brain</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
        }
        /* Sidebar */
        #sidebar {
            width: 300px;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #sidebar header {
            padding: 1rem;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        #sidebar header h1 { font-size: 1.1rem; font-weight: 600; color: #fff; }
        #sidebar header .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #22c55e; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        #conv-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }
        .empty-state {
            padding: 1.25rem 0.75rem;
            color: #666;
            font-size: 0.85rem;
            line-height: 1.45;
        }
        .empty-state strong { color: #aaa; font-weight: 500; }
        #chat:empty::before {
            content: "Inserisci la API key in basso a sinistra, poi chiedi alla tua memoria.";
            display: block;
            color: #555;
            font-size: 0.9rem;
            padding: 2rem 0;
            text-align: center;
        }
        #settings.error input { border-color: #b91c1c; }
        #settings .hint { color: #555; }
        #settings .hint.ok { color: #4ade80; }
        #settings .hint.err { color: #f87171; }
        .conv-item {
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 0.25rem;
            transition: background 0.15s;
        }
        .conv-item:hover { background: #1a1a1a; }
        .conv-item.active { background: #1d4ed8; }
        .conv-item .title {
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-item .meta {
            font-size: 0.75rem;
            color: #888;
            margin-top: 0.25rem;
        }
        .conv-item.active .meta { color: #a5b4fc; }
        /* Main area */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        #tabs {
            display: flex;
            border-bottom: 1px solid #222;
        }
        .tab {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 2px solid transparent;
            color: #888;
        }
        .tab.active { color: #fff; border-bottom-color: #1d4ed8; }
        .tab:hover { color: #ccc; }
        /* Chat panel */
        #chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
        }
        .message.user { align-self: flex-end; background: #1d4ed8; color: #fff; }
        .message.assistant { align-self: flex-start; background: #1f1f1f; border: 1px solid #333; }
        .message .sources {
            margin-top: 0.5rem; padding-top: 0.5rem;
            border-top: 1px solid #333; font-size: 0.8rem; color: #888;
        }
        .message.error { align-self: center; background: #7f1d1d; color: #fca5a5; font-size: 0.85rem; }
        #input-area {
            padding: 1rem 1.5rem;
            border-top: 1px solid #222;
            display: flex;
            gap: 0.75rem;
        }
        #input-area input {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #e0e0e0;
            font-size: 0.95rem;
            outline: none;
        }
        #input-area input:focus { border-color: #1d4ed8; }
        #input-area button {
            padding: 0.75rem 1.5rem;
            border-radius: 8px; border: none;
            background: #1d4ed8; color: #fff;
            font-size: 0.95rem; cursor: pointer; font-weight: 500;
        }
        #input-area button:hover { background: #2563eb; }
        #input-area button:disabled { background: #333; cursor: not-allowed; }
        /* Detail panel */
        #detail-panel {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: none;
        }
        #detail-panel.active { display: block; }
        #detail-panel h2 { font-size: 1.2rem; margin-bottom: 0.5rem; }
        #detail-panel .summary { color: #aaa; margin-bottom: 1.5rem; font-size: 0.9rem; }
        #detail-panel h3 { font-size: 0.95rem; color: #888; margin: 1rem 0 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .transcript-item {
            padding: 0.5rem 0;
            border-bottom: 1px solid #1a1a1a;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .transcript-item .time { font-size: 0.75rem; color: #666; }
        .entity-chip {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
            margin: 0.2rem;
            background: #1a1a1a;
            border: 1px solid #333;
        }
        .entity-chip.person { border-color: #3b82f6; color: #93c5fd; }
        .entity-chip.task { border-color: #f59e0b; color: #fcd34d; }
        .entity-chip.idea { border-color: #10b981; color: #6ee7b7; }
        .entity-chip.event { border-color: #8b5cf6; color: #c4b5fd; }
        .entity-chip.note { border-color: #6b7280; color: #9ca3af; }
        /* Settings bar */
        #settings {
            padding: 0.75rem 1rem;
            border-top: 1px solid #222;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: #666;
        }
        #settings .row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        #settings input {
            padding: 0.3rem 0.5rem;
            border-radius: 4px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #e0e0e0;
            font-size: 0.8rem;
            flex: 1;
            min-width: 0;
        }
        #settings button.use-dev {
            padding: 0.3rem 0.55rem;
            border-radius: 4px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #aaa;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
        }
        #settings button.use-dev:hover { border-color: #1d4ed8; color: #fff; }
        #settings .note { font-size: 0.72rem; color: #555; line-height: 1.3; }
    </style>
</head>
<body>
    <div id="sidebar">
        <header>
            <div class="dot"></div>
            <h1>Echo</h1>
        </header>
        <div id="conv-list"></div>
        <div id="settings">
            <div class="row">
                <label for="api-key">Echo key:</label>
                <input type="text" id="api-key" placeholder="my-secret-key" autocomplete="off" spellcheck="false" />
                <button type="button" class="use-dev" id="use-dev-key" title="Inserisci la key di sviluppo">Usa default</button>
            </div>
            <div class="row">
                <span class="hint" id="key-status"></span>
            </div>
            <div class="note">Non è la OPENAI_API_KEY del file .env — è la chiave Echo (locale: my-secret-key).</div>
        </div>
    </div>
    <div id="main">
        <div id="tabs">
            <div class="tab active" data-tab="chat" onclick="switchTab('chat')">💬 Chiedi</div>
            <div class="tab" data-tab="detail" onclick="switchTab('detail')">📄 Dettaglio</div>
        </div>
        <div id="chat-panel">
            <div id="chat"></div>
            <div id="input-area">
                <input type="text" id="question" placeholder="Chiedi alla tua memoria..." autofocus />
                <button id="send" onclick="askQuestion()">Chiedi</button>
            </div>
        </div>
        <div id="detail-panel"></div>
    </div>

    <script>
        const chatEl = document.getElementById('chat');
        const questionEl = document.getElementById('question');
        const sendBtn = document.getElementById('send');
        const apiKeyEl = document.getElementById('api-key');
        const convListEl = document.getElementById('conv-list');
        const detailPanel = document.getElementById('detail-panel');
        const keyStatusEl = document.getElementById('key-status');
        const settingsEl = document.getElementById('settings');
        const DEV_API_KEY = 'my-secret-key';

        let stored = (localStorage.getItem('echo_api_key') || '').trim();
        // Common mistake: pasting OPENAI_API_KEY (sk-...) into this field
        if (stored.startsWith('sk-')) {
            localStorage.removeItem('echo_api_key');
            stored = '';
        }
        apiKeyEl.value = stored;

        function saveAndLoadKey() {
            const key = apiKeyEl.value.trim();
            if (key.startsWith('sk-')) {
                setKeyStatus(false, 'questa è OpenAI, non Echo');
                convListEl.innerHTML = `
                    <div class="empty-state">
                        <strong>Key sbagliata</strong><br>
                        Hai inserito la OPENAI_API_KEY. Qui serve la chiave Echo:
                        <code>${DEV_API_KEY}</code>
                    </div>`;
                return;
            }
            localStorage.setItem('echo_api_key', key);
            loadConversations();
        }

        apiKeyEl.addEventListener('change', saveAndLoadKey);
        apiKeyEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                saveAndLoadKey();
            }
        });
        document.getElementById('use-dev-key').addEventListener('click', () => {
            apiKeyEl.value = DEV_API_KEY;
            saveAndLoadKey();
        });

        questionEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) askQuestion();
        });

        function getHeaders() {
            return { 'X-API-Key': apiKeyEl.value.trim(), 'Content-Type': 'application/json' };
        }

        function setKeyStatus(ok, msg) {
            settingsEl.classList.toggle('error', !ok && !!msg);
            keyStatusEl.className = 'hint ' + (ok ? 'ok' : (msg ? 'err' : ''));
            keyStatusEl.textContent = msg || '';
        }

        // --- Tabs ---
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
            document.getElementById('chat-panel').style.display = tab === 'chat' ? 'flex' : 'none';
            detailPanel.classList.toggle('active', tab === 'detail');
        }

        // --- Conversations ---
        async function loadConversations() {
            const key = apiKeyEl.value.trim();
            if (!key) {
                setKeyStatus(false, '');
                convListEl.innerHTML = `
                    <div class="empty-state">
                        <strong>Nessuna API key</strong><br>
                        Clicca <em>Usa default</em> oppure digita <code>${DEV_API_KEY}</code>
                        (non la OPENAI_API_KEY del .env).
                    </div>`;
                return;
            }
            try {
                const res = await fetch('/api/conversations?limit=50', { headers: getHeaders() });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    const detail = err.detail || `HTTP ${res.status}`;
                    setKeyStatus(false, 'non valida');
                    convListEl.innerHTML = `<div class="empty-state"><strong>Auth fallita</strong><br>${detail}</div>`;
                    return;
                }
                setKeyStatus(true, 'ok');
                const data = await res.json();
                renderConversations(data.conversations);
            } catch (e) {
                console.error(e);
                setKeyStatus(false, 'errore');
                convListEl.innerHTML = `<div class="empty-state"><strong>Errore di rete</strong><br>${e.message}</div>`;
            }
        }

        function renderConversations(conversations) {
            if (!conversations.length) {
                convListEl.innerHTML = `
                    <div class="empty-state">
                        <strong>Nessuna conversazione</strong><br>
                        Quando il wearable (o un upload) invia audio, apparirà qui.
                    </div>`;
                return;
            }
            convListEl.innerHTML = conversations.map(c => `
                <div class="conv-item" onclick="showConversation('${c.id}')" id="conv-${c.id}">
                    <div class="title">${c.title || 'Conversazione senza titolo'}</div>
                    <div class="meta">${formatDate(c.started_at)} · ${c.segment_count} segmenti</div>
                </div>
            `).join('');
        }

        async function showConversation(id) {
            document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
            const el = document.getElementById('conv-' + id);
            if (el) el.classList.add('active');

            try {
                const res = await fetch(`/api/conversations/${id}`, { headers: getHeaders() });
                if (!res.ok) return;
                const data = await res.json();
                renderDetail(data);
                switchTab('detail');
            } catch (e) { console.error(e); }
        }

        function renderDetail(conv) {
            const entities = conv.entities.map(e =>
                `<span class="entity-chip ${e.entity_type}">${e.entity_type}: ${e.name}</span>`
            ).join('');

            const transcripts = conv.transcriptions.map(t =>
                `<div class="transcript-item">
                    <span class="time">${formatTime(t.recorded_at)}</span>
                    <p>${t.text}</p>
                </div>`
            ).join('');

            detailPanel.innerHTML = `
                <h2>${conv.title || 'Conversazione'}</h2>
                <div class="summary">${conv.summary || ''}</div>
                ${entities ? '<h3>Entità</h3><div>' + entities + '</div>' : ''}
                <h3>Trascrizione</h3>
                ${transcripts || '<p style="color:#666">Nessuna trascrizione disponibile.</p>'}
            `;
        }

        // --- Chat ---
        function addMessage(text, role, sources) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            if (sources && sources.length > 0) {
                const srcDiv = document.createElement('div');
                srcDiv.className = 'sources';
                srcDiv.textContent = `📎 ${sources.length} fonti (${sources.map(s => (s.similarity * 100).toFixed(0) + '%').join(', ')})`;
                div.appendChild(srcDiv);
            }
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        async function askQuestion() {
            const question = questionEl.value.trim();
            if (!question || !apiKeyEl.value.trim()) {
                if (!apiKeyEl.value.trim()) addMessage('Inserisci una API key.', 'error');
                return;
            }
            addMessage(question, 'user');
            questionEl.value = '';
            sendBtn.disabled = true;
            try {
                const res = await fetch('/api/query', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ question, top_k: 5 }),
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || `HTTP ${res.status}`);
                }
                const data = await res.json();
                addMessage(data.answer, 'assistant', data.sources);
            } catch (err) {
                addMessage(`Errore: ${err.message}`, 'error');
            } finally {
                sendBtn.disabled = false;
                questionEl.focus();
            }
        }

        // --- Utils ---
        function formatDate(iso) {
            const d = new Date(iso);
            return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        }
        function formatTime(iso) {
            return new Date(iso).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
        }

        // --- Init ---
        loadConversations();
    </script>
</body>
</html>
