<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo — Second Brain</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
        }
        /* Sidebar */
        #sidebar {
            width: 280px;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #sidebar header {
            padding: 1rem;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #sidebar header .left { display: flex; align-items: center; gap: 0.5rem; }
        #sidebar header h1 { font-size: 1.1rem; font-weight: 600; color: #fff; }
        #sidebar header .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #22c55e; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .new-chat-btn {
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            border: 1px solid #333;
            background: transparent;
            color: #aaa;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .new-chat-btn:hover { border-color: #1d4ed8; color: #fff; }
        #sidebar-tabs {
            display: flex;
            border-bottom: 1px solid #222;
        }
        .sidebar-tab {
            flex: 1;
            padding: 0.6rem;
            text-align: center;
            cursor: pointer;
            font-size: 0.8rem;
            color: #666;
            border-bottom: 2px solid transparent;
        }
        .sidebar-tab.active { color: #fff; border-bottom-color: #1d4ed8; }
        #session-list, #conv-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }
        .hidden { display: none !important; }
        .empty-state {
            padding: 1.25rem 0.75rem;
            color: #666;
            font-size: 0.85rem;
            line-height: 1.45;
        }
        .empty-state strong { color: #aaa; font-weight: 500; }
        .session-item, .conv-item {
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 0.25rem;
            transition: background 0.15s;
        }
        .session-item:hover, .conv-item:hover { background: #1a1a1a; }
        .session-item.active, .conv-item.active { background: #1d4ed8; }
        .session-item .title, .conv-item .title {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .session-item .meta, .conv-item .meta {
            font-size: 0.72rem;
            color: #888;
            margin-top: 0.2rem;
        }
        .session-item.active .meta, .conv-item.active .meta { color: #a5b4fc; }
        .session-item .delete-btn {
            float: right;
            opacity: 0;
            color: #666;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .session-item:hover .delete-btn { opacity: 1; }
        .session-item .delete-btn:hover { color: #ef4444; }
        /* Main area */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        #chat-container.hidden { display: none; }
        /* Chat */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        #chat:empty::after {
            content: "Chiedi qualcosa alla tua memoria…";
            display: block;
            color: #555;
            font-size: 0.9rem;
            padding: 2rem 0;
            text-align: center;
        }
        .message {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
        .message.user { align-self: flex-end; background: #1d4ed8; color: #fff; }
        .message.assistant { align-self: flex-start; background: #1f1f1f; border: 1px solid #333; }
        .message .sources {
            margin-top: 0.5rem; padding-top: 0.5rem;
            border-top: 1px solid #333; font-size: 0.8rem; color: #888;
        }
        .message .date-filter {
            font-size: 0.75rem; color: #a78bfa; margin-top: 0.3rem;
        }
        .message.error { align-self: center; background: #7f1d1d; color: #fca5a5; font-size: 0.85rem; }
        #input-area {
            padding: 1rem 1.5rem;
            border-top: 1px solid #222;
            display: flex;
            gap: 0.75rem;
        }
        #input-area input {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #e0e0e0;
            font-size: 0.95rem;
            outline: none;
        }
        #input-area input:focus { border-color: #1d4ed8; }
        #input-area button {
            padding: 0.75rem 1.5rem;
            border-radius: 8px; border: none;
            background: #1d4ed8; color: #fff;
            font-size: 0.95rem; cursor: pointer; font-weight: 500;
        }
        #input-area button:hover { background: #2563eb; }
        #input-area button:disabled { background: #333; cursor: not-allowed; }
        /* Settings bar */
        #settings {
            padding: 0.75rem 1rem;
            border-top: 1px solid #222;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: #666;
        }
        #settings .row { display: flex; align-items: center; gap: 0.5rem; }
        #settings input {
            padding: 0.3rem 0.5rem;
            border-radius: 4px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #e0e0e0;
            font-size: 0.8rem;
            flex: 1;
            min-width: 0;
        }
        #settings button.use-dev {
            padding: 0.3rem 0.55rem;
            border-radius: 4px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #aaa;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
        }
        #settings button.use-dev:hover { border-color: #1d4ed8; color: #fff; }
        #settings .hint { font-size: 0.75rem; }
        #settings .hint.ok { color: #4ade80; }
        #settings .hint.err { color: #f87171; }
        #settings .note { font-size: 0.72rem; color: #555; line-height: 1.3; }
        .admin-link { font-size: 0.72rem; color: #555; text-align: center; margin-top: 0.5rem; }
        .admin-link a { color: #666; text-decoration: none; }
        .admin-link a:hover { color: #aaa; }
        /* Detail panel */
        #detail-panel {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: none;
        }
        #detail-panel.active { display: block; }
        #detail-panel h2 { font-size: 1.2rem; margin-bottom: 0.5rem; color: #fff; }
        #detail-panel .summary { color: #aaa; margin-bottom: 1.5rem; font-size: 0.9rem; }
        #detail-panel h3 { font-size: 0.85rem; color: #888; margin: 1rem 0 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
        #detail-panel .back-btn {
            padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid #333;
            background: transparent; color: #aaa; cursor: pointer; font-size: 0.8rem; margin-bottom: 1rem;
        }
        #detail-panel .back-btn:hover { border-color: #1d4ed8; color: #fff; }
        .transcript-item { padding: 0.5rem 0; border-bottom: 1px solid #1a1a1a; font-size: 0.9rem; line-height: 1.5; }
        .transcript-item .time { font-size: 0.75rem; color: #666; }
        .entity-chip {
            display: inline-block; padding: 0.25rem 0.6rem; border-radius: 12px;
            font-size: 0.8rem; margin: 0.2rem; background: #1a1a1a; border: 1px solid #333;
        }
        .entity-chip.person { border-color: #3b82f6; color: #93c5fd; }
        .entity-chip.task { border-color: #f59e0b; color: #fcd34d; }
        .entity-chip.idea { border-color: #10b981; color: #6ee7b7; }
        .entity-chip.event { border-color: #8b5cf6; color: #c4b5fd; }
        .entity-chip.note { border-color: #6b7280; color: #9ca3af; }
        /* Digest */
        #digest-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
        .digest-item { padding: 0.75rem; border-radius: 8px; cursor: pointer; margin-bottom: 0.25rem; }
        .digest-item:hover { background: #1a1a1a; }
        .digest-item .title { font-size: 0.85rem; font-weight: 500; color: #e0e0e0; }
        .digest-item .meta { font-size: 0.72rem; color: #888; margin-top: 0.2rem; }
        .digest-generate { padding: 0.5rem; text-align: center; }
        .digest-generate button {
            padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid #333;
            background: transparent; color: #aaa; cursor: pointer; font-size: 0.8rem; width: 100%;
        }
        .digest-generate button:hover { border-color: #1d4ed8; color: #fff; }
        #digest-panel { flex: 1; overflow-y: auto; padding: 1.5rem; display: none; }
        #digest-panel.active { display: block; }
        #digest-panel h2 { font-size: 1.2rem; margin-bottom: 0.5rem; color: #fff; }
        #digest-panel .digest-summary { color: #ccc; margin-bottom: 1.5rem; font-size: 0.95rem; line-height: 1.5; }
        #digest-panel .digest-section { margin-bottom: 1rem; }
        #digest-panel .digest-section h3 { font-size: 0.85rem; color: #888; text-transform: uppercase; margin-bottom: 0.4rem; }
        #digest-panel .digest-section ul { list-style: none; padding: 0; }
        #digest-panel .digest-section li { padding: 0.3rem 0; font-size: 0.9rem; color: #bbb; }
        /* Session badge */
        .session-badge { font-size: 0.7rem; color: #a78bfa; margin-left: 0.3rem; }
        /* Conv status */
        .status-badge { font-size: 0.7rem; padding: 1px 5px; border-radius: 3px; margin-left: 0.3rem; }
        .status-badge.completed { background: #166534; color: #86efac; }
        .status-badge.pending { background: #713f12; color: #fcd34d; }
    </style>
</head>
<body>
    <div id="sidebar">
        <header>
            <div class="left"><div class="dot"></div><h1>Echo</h1></div>
            <button class="new-chat-btn" onclick="newChat()">+ Nuova</button>
        </header>
        <div id="sidebar-tabs">
            <div class="sidebar-tab active" data-tab="sessions" onclick="switchSidebarTab('sessions')">💬 Chat</div>
            <div class="sidebar-tab" data-tab="conversations" onclick="switchSidebarTab('conversations')">🎙️ Audio</div>
            <div class="sidebar-tab" data-tab="digests" onclick="switchSidebarTab('digests')">📊 Digest</div>
        </div>
        <div id="session-list"></div>
        <div id="conv-list" class="hidden"></div>
        <div id="digest-list" class="hidden"></div>
        <div id="settings">
            <div class="row">
                <label for="api-key">Key:</label>
                <input type="text" id="api-key" placeholder="my-secret-key" autocomplete="off" spellcheck="false" />
                <button type="button" class="use-dev" onclick="useDevKey()">Default</button>
            </div>
            <div class="row"><span class="hint" id="key-status"></span></div>
            <div class="note">La chiave Echo locale, non la OPENAI_API_KEY.</div>
            <div class="admin-link"><a href="/admin.html">⚙️ Admin Dashboard</a></div>
        </div>
    </div>
    <div id="main">
        <div id="chat-container">
            <div id="session-indicator" class="hidden" style="padding: 0.4rem 1.5rem; font-size: 0.75rem; color: #a78bfa; border-bottom: 1px solid #222;">🔄 Follow-up attivo — il contesto è mantenuto</div>
            <div id="chat"></div>
            <div id="input-area">
                <input type="text" id="question" placeholder="Chiedi alla tua memoria..." autofocus />
                <button id="send" onclick="askQuestion()">Chiedi</button>
            </div>
        </div>
        <div id="detail-panel"></div>
        <div id="digest-panel"></div>
    </div>

    <script>
        const chatEl = document.getElementById('chat');
        const questionEl = document.getElementById('question');
        const sendBtn = document.getElementById('send');
        const apiKeyEl = document.getElementById('api-key');
        const sessionListEl = document.getElementById('session-list');
        const convListEl = document.getElementById('conv-list');
        const keyStatusEl = document.getElementById('key-status');

        let currentSessionId = null;

        // --- Init ---
        const stored = (localStorage.getItem('echo_api_key') || '').trim();
        if (stored && !stored.startsWith('sk-')) apiKeyEl.value = stored;

        apiKeyEl.addEventListener('change', onKeyChange);
        apiKeyEl.addEventListener('keydown', e => { if (e.key === 'Enter') onKeyChange(); });
        questionEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !sendBtn.disabled) askQuestion(); });

        function useDevKey() { apiKeyEl.value = 'my-secret-key'; onKeyChange(); }

        function onKeyChange() {
            const key = apiKeyEl.value.trim();
            if (key.startsWith('sk-')) { setKeyStatus(false, 'questa è OpenAI, non Echo'); return; }
            localStorage.setItem('echo_api_key', key);
            loadSessions();
            loadConversations();
        }

        function setKeyStatus(ok, msg) {
            keyStatusEl.className = 'hint ' + (ok ? 'ok' : (msg ? 'err' : ''));
            keyStatusEl.textContent = msg || '';
        }

        function getHeaders() {
            return { 'X-API-Key': apiKeyEl.value.trim(), 'Content-Type': 'application/json' };
        }

        // --- Sidebar tabs ---
        function switchSidebarTab(tab) {
            document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
            sessionListEl.classList.toggle('hidden', tab !== 'sessions');
            convListEl.classList.toggle('hidden', tab !== 'conversations');
            document.getElementById('digest-list').classList.toggle('hidden', tab !== 'digests');
            if (tab === 'digests') loadDigests();
        }

        // --- Chat Sessions ---
        async function loadSessions() {
            const key = apiKeyEl.value.trim();
            if (!key) { sessionListEl.innerHTML = '<div class="empty-state">Inserisci API key</div>'; return; }
            try {
                const res = await fetch('/api/chat-sessions', { headers: getHeaders() });
                if (!res.ok) { setKeyStatus(false, 'non valida'); return; }
                setKeyStatus(true, 'ok');
                const data = await res.json();
                renderSessions(data.items);
            } catch (e) { sessionListEl.innerHTML = '<div class="empty-state">Errore di rete</div>'; }
        }

        function renderSessions(sessions) {
            if (!sessions.length) {
                sessionListEl.innerHTML = '<div class="empty-state">Nessuna chat ancora.<br>Fai una domanda!</div>';
                return;
            }
            sessionListEl.innerHTML = sessions.map(s => `
                <div class="session-item ${s.id === currentSessionId ? 'active' : ''}" onclick="loadSession('${s.id}')">
                    <span class="delete-btn" onclick="event.stopPropagation(); deleteSession('${s.id}')">✕</span>
                    <div class="title">${escHtml(s.title || 'Chat senza titolo')}</div>
                    <div class="meta">${formatDate(s.updated_at)} · ${s.message_count} msg</div>
                </div>
            `).join('');
        }

        async function loadSession(id) {
            currentSessionId = id;
            try {
                const res = await fetch(`/api/chat-sessions/${id}`, { headers: getHeaders() });
                if (!res.ok) return;
                const data = await res.json();
                chatEl.innerHTML = '';
                data.messages.forEach(m => addMessage(m.content, m.role));
                updateSessionIndicator();
                closeDetail();
                closeDigest();
                loadSessions(); // refresh active state
            } catch (e) { console.error(e); }
        }

        async function deleteSession(id) {
            if (!confirm('Eliminare questa chat?')) return;
            await fetch(`/api/chat-sessions/${id}`, { method: 'DELETE', headers: getHeaders() });
            if (currentSessionId === id) newChat();
            loadSessions();
        }

        function newChat() {
            currentSessionId = null;
            chatEl.innerHTML = '';
            document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
            updateSessionIndicator();
            // Return to chat view if on detail/digest
            closeDetail();
            closeDigest();
        }

        // --- Conversations (audio) ---
        async function loadConversations() {
            const key = apiKeyEl.value.trim();
            if (!key) return;
            try {
                const res = await fetch('/api/conversations?limit=50', { headers: getHeaders() });
                if (!res.ok) return;
                const data = await res.json();
                if (!data.conversations || !data.conversations.length) {
                    convListEl.innerHTML = '<div class="empty-state">Nessuna conversazione audio.</div>';
                    return;
                }
                convListEl.innerHTML = data.conversations.map(c => `
                    <div class="conv-item" onclick="showConversation('${c.id}')">
                        <div class="title">${escHtml(c.title || 'Senza titolo')} <span class="status-badge ${c.analysis_status}">${c.analysis_status === 'completed' ? '✓' : '⏳'}</span></div>
                        <div class="meta">${formatDate(c.started_at)} · ${c.segment_count} segmenti</div>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }

        async function showConversation(id) {
            try {
                const res = await fetch(`/api/conversations/${id}`, { headers: getHeaders() });
                if (!res.ok) return;
                const data = await res.json();
                renderDetail(data);
            } catch (e) { console.error(e); }
        }

        function renderDetail(conv) {
            const detailPanel = document.getElementById('detail-panel');
            const chatContainer = document.getElementById('chat-container');

            const entities = conv.entities.map(e =>
                `<span class="entity-chip ${e.entity_type}">${escHtml(e.entity_type)}: ${escHtml(e.name)}</span>`
            ).join('');

            const transcripts = conv.transcriptions.map(t =>
                `<div class="transcript-item">
                    <span class="time">${formatTime(t.recorded_at)}</span>
                    <p>${escHtml(t.text)}</p>
                </div>`
            ).join('');

            detailPanel.innerHTML = `
                <button class="back-btn" onclick="closeDetail()">← Torna alla chat</button>
                <h2>${escHtml(conv.title || 'Conversazione')}</h2>
                <div class="summary">${escHtml(conv.summary || '')}</div>
                ${entities ? '<h3>Entità</h3><div>' + entities + '</div>' : ''}
                <h3>Trascrizione</h3>
                ${transcripts || '<p style="color:#666">Nessuna trascrizione disponibile.</p>'}
            `;

            chatContainer.classList.add('hidden');
            detailPanel.classList.add('active');
        }

        function closeDetail() {
            document.getElementById('detail-panel').classList.remove('active');
            document.getElementById('chat-container').classList.remove('hidden');
        }

        function formatTime(iso) {
            if (!iso) return '';
            return new Date(iso).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
        }

        // --- Chat ---
        function addMessage(text, role, sources, dateFilter) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            if (sources && sources.length > 0) {
                const srcDiv = document.createElement('div');
                srcDiv.className = 'sources';
                srcDiv.textContent = `📎 ${sources.length} fonti (${sources.map(s => (s.similarity * 100).toFixed(0) + '%').join(', ')})`;
                div.appendChild(srcDiv);
            }
            if (dateFilter) {
                const dfDiv = document.createElement('div');
                dfDiv.className = 'date-filter';
                dfDiv.textContent = `📅 Filtro: ${new Date(dateFilter.from).toLocaleDateString('it-IT')} – ${new Date(dateFilter.to).toLocaleDateString('it-IT')}`;
                div.appendChild(dfDiv);
            }
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        async function askQuestion() {
            const question = questionEl.value.trim();
            if (!question || !apiKeyEl.value.trim()) return;
            addMessage(question, 'user');
            questionEl.value = '';
            sendBtn.disabled = true;
            try {
                const body = { question, top_k: 5 };
                if (currentSessionId) body.session_id = currentSessionId;

                const res = await fetch('/api/query', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify(body),
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || `HTTP ${res.status}`);
                }
                const data = await res.json();
                currentSessionId = data.session_id;
                addMessage(data.answer, 'assistant', data.sources, data.date_filter);
                updateSessionIndicator();
                // Refresh session list (new session may have been created)
                loadSessions();
            } catch (err) {
                addMessage(`Errore: ${err.message}`, 'error');
            } finally {
                sendBtn.disabled = false;
                questionEl.focus();
            }
        }

        // --- Utils ---
        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        }
        function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        function updateSessionIndicator() {
            document.getElementById('session-indicator').classList.toggle('hidden', !currentSessionId);
        }

        // --- Digests ---
        async function loadDigests() {
            const key = apiKeyEl.value.trim();
            if (!key) return;
            const digestListEl = document.getElementById('digest-list');
            try {
                const res = await fetch('/api/digest?days=14', { headers: getHeaders() });
                if (!res.ok) return;
                const data = await res.json();
                let html = `<div class="digest-generate"><button onclick="generateTodayDigest()">📊 Genera digest di oggi</button></div>`;
                if (!data.items.length) {
                    html += '<div class="empty-state">Nessun digest ancora. Genera il primo!</div>';
                } else {
                    html += data.items.map(d => `
                        <div class="digest-item" onclick="showDigest('${d.digest_date}')">
                            <div class="title">📊 ${new Date(d.digest_date + 'T00:00:00').toLocaleDateString('it-IT', {weekday: 'short', day: 'numeric', month: 'short'})}</div>
                            <div class="meta">${d.conversation_count} conversazioni · ${d.people.length} persone</div>
                        </div>
                    `).join('');
                }
                digestListEl.innerHTML = html;
            } catch (e) { console.error(e); }
        }

        async function showDigest(date) {
            try {
                const res = await fetch(`/api/digest/${date}`, { headers: getHeaders() });
                if (!res.ok) return;
                const d = await res.json();
                renderDigestPanel(d);
            } catch (e) { console.error(e); }
        }

        function renderDigestPanel(d) {
            const panel = document.getElementById('digest-panel');
            const chatContainer = document.getElementById('chat-container');
            const detailPanel = document.getElementById('detail-panel');

            const dateStr = new Date(d.digest_date + 'T00:00:00').toLocaleDateString('it-IT', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});

            let sections = '';
            if (d.people.length) sections += `<div class="digest-section"><h3>👤 Persone</h3><ul>${d.people.map(p => `<li>${escHtml(p)}</li>`).join('')}</ul></div>`;
            if (d.tasks.length) sections += `<div class="digest-section"><h3>✅ Task</h3><ul>${d.tasks.map(t => `<li>${escHtml(t.name || t)}${t.content ? ': ' + escHtml(t.content) : ''}</li>`).join('')}</ul></div>`;
            if (d.ideas.length) sections += `<div class="digest-section"><h3>💡 Idee</h3><ul>${d.ideas.map(i => `<li>${escHtml(i.name || i)}${i.content ? ': ' + escHtml(i.content) : ''}</li>`).join('')}</ul></div>`;
            if (d.events.length) sections += `<div class="digest-section"><h3>📅 Eventi</h3><ul>${d.events.map(e => `<li>${escHtml(e.name || e)}${e.content ? ': ' + escHtml(e.content) : ''}</li>`).join('')}</ul></div>`;

            panel.innerHTML = `
                <button class="back-btn" onclick="closeDigest()" style="padding:0.4rem 0.8rem;border-radius:6px;border:1px solid #333;background:transparent;color:#aaa;cursor:pointer;font-size:0.8rem;margin-bottom:1rem;">← Torna alla chat</button>
                <h2>📊 Digest — ${dateStr}</h2>
                <p style="font-size:0.8rem;color:#888;margin-bottom:1rem;">${d.conversation_count} conversazioni</p>
                <div class="digest-summary">${escHtml(d.summary)}</div>
                ${sections}
            `;

            chatContainer.classList.add('hidden');
            detailPanel.classList.remove('active');
            panel.classList.add('active');
        }

        function closeDigest() {
            document.getElementById('digest-panel').classList.remove('active');
            document.getElementById('chat-container').classList.remove('hidden');
        }

        async function generateTodayDigest() {
            const today = new Date().toISOString().split('T')[0];
            try {
                const res = await fetch(`/api/digest/${today}`, { method: 'POST', headers: getHeaders() });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    alert(err.detail || 'Errore nella generazione');
                    return;
                }
                const d = await res.json();
                renderDigestPanel(d);
                loadDigests();
            } catch (e) { alert('Errore: ' + e.message); }
        }

        // --- Boot ---
        if (apiKeyEl.value.trim()) { loadSessions(); loadConversations(); }
    </script>
</body>
</html>
