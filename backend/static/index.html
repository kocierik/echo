<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo — Second Brain</title>
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #0d0d0d;
            --bg-tertiary: #1a1a1a;
            --bg-elevated: #1c1c1e;
            --bg-glass: rgba(28, 28, 30, 0.72);
            --border: rgba(255, 255, 255, 0.08);
            --border-active: rgba(255, 255, 255, 0.2);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --text-tertiary: #636366;
            --accent: #0a84ff;
            --accent-hover: #409cff;
            --success: #30d158;
            --warning: #ffd60a;
            --danger: #ff453a;
            --purple: #bf5af2;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow: 0 2px 20px rgba(0,0,0,0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            -webkit-font-smoothing: antialiased;
        }
        /* Sidebar */
        #sidebar {
            width: 300px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(20px);
        }
        #sidebar header {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #sidebar header .left { display: flex; align-items: center; gap: 0.6rem; }
        #sidebar header h1 { font-size: 1.15rem; font-weight: 600; letter-spacing: -0.02em; }
        #sidebar header .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 6px rgba(48,209,88,0.5);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .new-chat-btn {
            padding: 0.4rem 0.75rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.78rem;
            transition: all 0.2s;
        }
        .new-chat-btn:hover { border-color: var(--accent); color: var(--text-primary); }
        #sidebar-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            padding: 0 0.5rem;
        }
        .sidebar-tab {
            flex: 1;
            padding: 0.7rem 0.4rem;
            text-align: center;
            cursor: pointer;
            font-size: 0.75rem;
            color: var(--text-tertiary);
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .sidebar-tab:hover { color: var(--text-secondary); }
        .sidebar-tab.active { color: var(--text-primary); border-bottom-color: var(--accent); }
        #session-list, #conv-list, #digest-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }
        .hidden { display: none !important; }
        .empty-state {
            padding: 2rem 1rem;
            color: var(--text-tertiary);
            font-size: 0.85rem;
            line-height: 1.5;
            text-align: center;
        }
        .session-item, .conv-item, .digest-item {
            padding: 0.75rem 0.85rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            margin-bottom: 2px;
            transition: background 0.15s;
        }
        .session-item:hover, .conv-item:hover, .digest-item:hover { background: var(--bg-tertiary); }
        .session-item.active { background: var(--accent); }
        .session-item .title, .conv-item .title, .digest-item .title {
            font-size: 0.84rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .session-item .meta, .conv-item .meta, .digest-item .meta {
            font-size: 0.7rem;
            color: var(--text-tertiary);
            margin-top: 0.15rem;
        }
        .session-item.active .meta { color: rgba(255,255,255,0.7); }
        .session-item .delete-btn {
            float: right; opacity: 0; color: var(--text-tertiary);
            cursor: pointer; font-size: 0.75rem; transition: opacity 0.15s;
        }
        .session-item:hover .delete-btn { opacity: 1; }
        .session-item .delete-btn:hover { color: var(--danger); }
        /* Main */
        #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-primary); }
        #chat-container { flex: 1; display: flex; flex-direction: column; }
        #chat-container.hidden { display: none; }
        #chat {
            flex: 1; overflow-y: auto; padding: 2rem;
            display: flex; flex-direction: column; gap: 1rem;
        }
        #chat:empty::after {
            content: "Chiedi qualcosa alla tua memoria…";
            display: block; color: var(--text-tertiary);
            font-size: 1rem; padding: 4rem 0; text-align: center;
        }
        .message {
            max-width: 72%; padding: 0.85rem 1.1rem;
            border-radius: var(--radius-lg); line-height: 1.55;
            font-size: 0.92rem; white-space: pre-wrap;
        }
        .message.user {
            align-self: flex-end;
            background: var(--accent);
            color: #fff;
        }
        .message.assistant {
            align-self: flex-start;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
        }
        .message .sources {
            margin-top: 0.5rem; padding-top: 0.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.75rem; color: var(--text-tertiary);
        }
        .message .date-filter {
            font-size: 0.72rem; color: var(--purple); margin-top: 0.25rem;
        }
        .message .feedback-row {
            margin-top: 0.5rem; display: flex; gap: 0.5rem; align-items: center;
        }
        .feedback-btn {
            background: transparent; border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 0.25rem 0.5rem;
            cursor: pointer; font-size: 0.8rem; color: var(--text-tertiary);
            transition: all 0.2s;
        }
        .feedback-btn:hover { border-color: var(--border-active); color: var(--text-primary); }
        .feedback-btn.active-pos { border-color: var(--success); color: var(--success); background: rgba(48,209,88,0.1); }
        .feedback-btn.active-neg { border-color: var(--danger); color: var(--danger); background: rgba(255,69,58,0.1); }
        .message.error { align-self: center; background: rgba(255,69,58,0.1); color: var(--danger); font-size: 0.85rem; border: 1px solid rgba(255,69,58,0.2); }
        #input-area {
            padding: 1rem 2rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex; gap: 0.75rem;
        }
        #input-area input {
            flex: 1; padding: 0.8rem 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 0.92rem; outline: none;
            transition: border-color 0.2s;
        }
        #input-area input:focus { border-color: var(--accent); }
        #input-area button {
            padding: 0.8rem 1.5rem; border-radius: var(--radius-md);
            border: none; background: var(--accent); color: #fff;
            font-size: 0.92rem; cursor: pointer; font-weight: 500;
            transition: background 0.2s;
        }
        #input-area button:hover { background: var(--accent-hover); }
        #input-area button:disabled { background: var(--bg-tertiary); color: var(--text-tertiary); cursor: not-allowed; }
        /* Settings */
        #settings {
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 0.4rem; font-size: 0.78rem;
        }
        #settings .row { display: flex; align-items: center; gap: 0.5rem; }
        #settings input {
            padding: 0.35rem 0.5rem; border-radius: 6px;
            border: 1px solid var(--border); background: var(--bg-tertiary);
            color: var(--text-primary); font-size: 0.78rem; flex: 1; min-width: 0;
        }
        #settings button.use-dev {
            padding: 0.3rem 0.55rem; border-radius: 6px;
            border: 1px solid var(--border); background: transparent;
            color: var(--text-secondary); font-size: 0.72rem; cursor: pointer;
        }
        #settings button.use-dev:hover { border-color: var(--accent); color: var(--text-primary); }
        #settings .hint { font-size: 0.72rem; }
        #settings .hint.ok { color: var(--success); }
        #settings .hint.err { color: var(--danger); }
        #settings .note { font-size: 0.7rem; color: var(--text-tertiary); }
        .admin-link { font-size: 0.7rem; color: var(--text-tertiary); text-align: center; margin-top: 0.4rem; }
        .admin-link a { color: var(--text-tertiary); text-decoration: none; }
        .admin-link a:hover { color: var(--text-secondary); }
        /* Detail panel */
        #detail-panel, #digest-panel { flex: 1; overflow-y: auto; padding: 2rem; display: none; }
        #detail-panel.active, #digest-panel.active { display: block; }
        #detail-panel h2, #digest-panel h2 { font-size: 1.3rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
        .back-btn {
            padding: 0.4rem 0.8rem; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: transparent;
            color: var(--text-secondary); cursor: pointer; font-size: 0.78rem;
            margin-bottom: 1.25rem; transition: all 0.2s;
        }
        .back-btn:hover { border-color: var(--accent); color: var(--text-primary); }
        .entity-chip {
            display: inline-flex; align-items: center; gap: 0.3rem;
            padding: 0.3rem 0.7rem; border-radius: 20px;
            font-size: 0.78rem; margin: 0.2rem;
            background: var(--bg-tertiary); border: 1px solid var(--border);
        }
        .entity-chip.person { border-color: rgba(10,132,255,0.4); color: #64b5f6; }
        .entity-chip.task { border-color: rgba(255,214,10,0.4); color: #ffd60a; }
        .entity-chip.idea { border-color: rgba(48,209,88,0.4); color: #30d158; }
        .entity-chip.event { border-color: rgba(191,90,242,0.4); color: #bf5af2; }
        .entity-chip.note { border-color: var(--border); color: var(--text-secondary); }
        .entity-chip .edit-entity, .entity-chip .delete-entity {
            cursor: pointer; opacity: 0.5; font-size: 0.7rem; transition: opacity 0.15s;
        }
        .entity-chip .edit-entity:hover { opacity: 1; }
        .entity-chip .delete-entity:hover { opacity: 1; color: var(--danger); }
        .transcript-item { padding: 0.6rem 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; line-height: 1.55; }
        .transcript-item .time { font-size: 0.72rem; color: var(--text-tertiary); }
        .transcript-item .speaker-tag { font-size: 0.72rem; font-weight: 600; margin-right: 0.3rem; }
        .transcript-item .speaker-tag.self { color: var(--accent); }
        .transcript-item .speaker-tag.other { color: var(--purple); }
        #session-indicator {
            padding: 0.4rem 2rem; font-size: 0.72rem; color: var(--purple);
            border-bottom: 1px solid var(--border); background: rgba(191,90,242,0.05);
        }
        .status-badge { font-size: 0.68rem; padding: 1px 6px; border-radius: 4px; margin-left: 0.3rem; }
        .status-badge.completed { background: rgba(48,209,88,0.15); color: var(--success); }
        .status-badge.pending { background: rgba(255,214,10,0.15); color: var(--warning); }
        .digest-summary { color: #ccc; margin-bottom: 1.5rem; font-size: 0.95rem; line-height: 1.6; }
        .digest-section { margin-bottom: 1.25rem; }
        .digest-section h3 { font-size: 0.8rem; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem; }
        .digest-section ul { list-style: none; }
        .digest-section li { padding: 0.3rem 0; font-size: 0.88rem; color: var(--text-secondary); }
        .digest-generate button {
            width: 100%; padding: 0.5rem; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: transparent;
            color: var(--text-secondary); cursor: pointer; font-size: 0.78rem;
            transition: all 0.2s;
        }
        .digest-generate button:hover { border-color: var(--accent); color: var(--text-primary); }
    </style>
</head>
<body>
    <div id="sidebar">
        <header>
            <div class="left"><div class="dot"></div><h1>Echo</h1></div>
            <button class="new-chat-btn" onclick="newChat()">+ Nuova</button>
        </header>
        <div id="sidebar-tabs">
            <div class="sidebar-tab active" data-tab="sessions" onclick="switchSidebarTab('sessions')">💬 Chat</div>
            <div class="sidebar-tab" data-tab="conversations" onclick="switchSidebarTab('conversations')">🎙️ Audio</div>
            <div class="sidebar-tab" data-tab="digests" onclick="switchSidebarTab('digests')">📊 Digest</div>
        </div>
        <div id="session-list"></div>
        <div id="conv-list" class="hidden"></div>
        <div id="digest-list" class="hidden"></div>
        <div id="settings">
            <div class="row">
                <label for="api-key" style="color:var(--text-tertiary)">Key:</label>
                <input type="text" id="api-key" placeholder="my-secret-key" autocomplete="off" spellcheck="false" />
                <button type="button" class="use-dev" onclick="useDevKey()">Default</button>
            </div>
            <div class="row"><span class="hint" id="key-status"></span></div>
            <div class="note">La chiave Echo locale, non la OPENAI_API_KEY.</div>
            <div class="admin-link"><a href="/admin.html">⚙️ Admin</a></div>
        </div>
    </div>
    <div id="main">
        <div id="chat-container">
            <div id="session-indicator" class="hidden">🔄 Follow-up attivo — contesto mantenuto</div>
            <div id="chat"></div>
            <div id="input-area">
                <input type="text" id="question" placeholder="Chiedi alla tua memoria..." autofocus />
                <button id="send" onclick="askQuestion()">Chiedi</button>
            </div>
        </div>
        <div id="detail-panel"></div>
        <div id="digest-panel"></div>
    </div>

    <script>
        const chatEl = document.getElementById('chat');
        const questionEl = document.getElementById('question');
        const sendBtn = document.getElementById('send');
        const apiKeyEl = document.getElementById('api-key');
        const sessionListEl = document.getElementById('session-list');
        const convListEl = document.getElementById('conv-list');
        const keyStatusEl = document.getElementById('key-status');
        let currentSessionId = null;
        let lastSources = [];

        // Init
        const stored = (localStorage.getItem('echo_api_key') || '').trim();
        if (stored && !stored.startsWith('sk-')) apiKeyEl.value = stored;
        apiKeyEl.addEventListener('change', onKeyChange);
        apiKeyEl.addEventListener('keydown', e => { if (e.key === 'Enter') onKeyChange(); });
        questionEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !sendBtn.disabled) askQuestion(); });

        function useDevKey() { apiKeyEl.value = 'my-secret-key'; onKeyChange(); }
        function onKeyChange() {
            const key = apiKeyEl.value.trim();
            if (key.startsWith('sk-')) { setKeyStatus(false, 'questa è OpenAI, non Echo'); return; }
            localStorage.setItem('echo_api_key', key);
            loadSessions(); loadConversations();
        }
        function setKeyStatus(ok, msg) {
            keyStatusEl.className = 'hint ' + (ok ? 'ok' : (msg ? 'err' : ''));
            keyStatusEl.textContent = msg || '';
        }
        function getHeaders() { return { 'X-API-Key': apiKeyEl.value.trim(), 'Content-Type': 'application/json' }; }

        // Sidebar tabs
        function switchSidebarTab(tab) {
            document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
            sessionListEl.classList.toggle('hidden', tab !== 'sessions');
            convListEl.classList.toggle('hidden', tab !== 'conversations');
            document.getElementById('digest-list').classList.toggle('hidden', tab !== 'digests');
            if (tab === 'digests') loadDigests();
        }

        // Sessions
        async function loadSessions() {
            const key = apiKeyEl.value.trim();
            if (!key) { sessionListEl.innerHTML = '<div class="empty-state">Inserisci API key</div>'; return; }
            try {
                const res = await fetch('/api/chat-sessions', { headers: getHeaders() });
                if (!res.ok) { setKeyStatus(false, 'non valida'); return; }
                setKeyStatus(true, 'ok');
                const data = await res.json();
                renderSessions(data.items);
            } catch(e) { sessionListEl.innerHTML = '<div class="empty-state">Errore di rete</div>'; }
        }
        function renderSessions(sessions) {
            if (!sessions.length) { sessionListEl.innerHTML = '<div class="empty-state">Nessuna chat.<br>Fai una domanda!</div>'; return; }
            sessionListEl.innerHTML = sessions.map(s => `
                <div class="session-item ${s.id===currentSessionId?'active':''}" onclick="loadSession('${s.id}')">
                    <span class="delete-btn" onclick="event.stopPropagation();deleteSession('${s.id}')">✕</span>
                    <div class="title">${esc(s.title||'Chat')}</div>
                    <div class="meta">${fmtDate(s.updated_at)} · ${s.message_count} msg</div>
                </div>`).join('');
        }
        async function loadSession(id) {
            currentSessionId = id;
            try {
                const res = await fetch(`/api/chat-sessions/${id}`, { headers: getHeaders() });
                if (!res.ok) return;
                const data = await res.json();
                chatEl.innerHTML = '';
                data.messages.forEach(m => addMessage(m.content, m.role));
                updateIndicator(); closeDetail(); closeDigest(); loadSessions();
            } catch(e) {}
        }
        async function deleteSession(id) {
            if (!confirm('Eliminare questa chat?')) return;
            await fetch(`/api/chat-sessions/${id}`, { method:'DELETE', headers:getHeaders() });
            if (currentSessionId===id) newChat();
            loadSessions();
        }
        function newChat() {
            currentSessionId = null; chatEl.innerHTML = '';
            document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
            updateIndicator(); closeDetail(); closeDigest();
        }

        // Conversations
        async function loadConversations() {
            const key = apiKeyEl.value.trim(); if (!key) return;
            try {
                const res = await fetch('/api/conversations?limit=50', { headers:getHeaders() });
                if (!res.ok) return;
                const data = await res.json();
                if (!data.conversations.length) { convListEl.innerHTML='<div class="empty-state">Nessuna conversazione audio.</div>'; return; }
                convListEl.innerHTML = data.conversations.map(c => `
                    <div class="conv-item" onclick="showConversation('${c.id}')">
                        <div class="title">${esc(c.title||'Senza titolo')} <span class="status-badge ${c.analysis_status}">${c.analysis_status==='completed'?'✓':'⏳'}</span></div>
                        <div class="meta">${fmtDate(c.started_at)} · ${c.segment_count} seg</div>
                    </div>`).join('');
            } catch(e) {}
        }
        async function showConversation(id) {
            try {
                const res = await fetch(`/api/conversations/${id}`, { headers:getHeaders() });
                if (!res.ok) return;
                renderDetail(await res.json());
            } catch(e) {}
        }
        function renderDetail(conv) {
            const dp = document.getElementById('detail-panel');
            const entities = conv.entities.map(e => `
                <span class="entity-chip ${e.entity_type}">
                    ${esc(e.name)}
                    <span class="edit-entity" onclick="editEntity('${e.id}','${esc(e.name)}','${e.entity_type}')">✏️</span>
                    <span class="delete-entity" onclick="deleteEntity('${e.id}')">🗑️</span>
                </span>`).join('');
            const transcripts = conv.transcriptions.map(t => {
                let speaker = '';
                if (t.text.startsWith('[Tu]')) speaker = '<span class="speaker-tag self">[Tu]</span>';
                else if (t.text.startsWith('[Altri]')) speaker = '<span class="speaker-tag other">[Altri]</span>';
                const text = t.text.replace(/^\[(Tu|Altri)\]\s*/, '');
                return `<div class="transcript-item"><span class="time">${fmtTime(t.recorded_at)}</span> ${speaker}${esc(text)}</div>`;
            }).join('');
            dp.innerHTML = `
                <button class="back-btn" onclick="closeDetail()">← Chat</button>
                <h2>${esc(conv.title||'Conversazione')}</h2>
                <p style="color:var(--text-secondary);margin-bottom:1.5rem;font-size:0.9rem">${esc(conv.summary||'')}</p>
                ${entities?'<h3 style="font-size:0.8rem;color:var(--text-tertiary);margin-bottom:0.5rem">ENTITÀ</h3><div style="margin-bottom:1.5rem">'+entities+'</div>':''}
                <h3 style="font-size:0.8rem;color:var(--text-tertiary);margin-bottom:0.5rem">TRASCRIZIONE</h3>
                ${transcripts||'<p style="color:var(--text-tertiary)">Nessuna trascrizione.</p>'}`;
            document.getElementById('chat-container').classList.add('hidden');
            dp.classList.add('active');
        }
        function closeDetail() { document.getElementById('detail-panel').classList.remove('active'); document.getElementById('chat-container').classList.remove('hidden'); }

        // Entity CRUD
        async function deleteEntity(id) {
            if (!confirm('Eliminare questa entità?')) return;
            await fetch(`/api/entities/${id}`, { method:'DELETE', headers:getHeaders() });
            loadConversations();
        }
        async function editEntity(id, name, type) {
            const newName = prompt('Nome:', name);
            if (!newName || newName === name) return;
            await fetch(`/api/entities/${id}`, { method:'PATCH', headers:getHeaders(), body:JSON.stringify({name:newName}) });
            loadConversations();
        }

        // Chat
        function addMessage(text, role, sources, dateFilter, msgIdx) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            if (sources && sources.length) {
                const s = document.createElement('div'); s.className='sources';
                s.textContent = `📎 ${sources.length} fonti (${sources.map(x=>(x.similarity*100).toFixed(0)+'%').join(', ')})`;
                div.appendChild(s);
            }
            if (dateFilter) {
                const d = document.createElement('div'); d.className='date-filter';
                d.textContent = `📅 ${new Date(dateFilter.from).toLocaleDateString('it-IT')} – ${new Date(dateFilter.to).toLocaleDateString('it-IT')}`;
                div.appendChild(d);
            }
            // Feedback buttons for assistant messages
            if (role === 'assistant' && msgIdx !== undefined) {
                const fb = document.createElement('div'); fb.className='feedback-row';
                fb.innerHTML = `
                    <button class="feedback-btn" onclick="sendFeedback(this,'positive',${msgIdx})">👍</button>
                    <button class="feedback-btn" onclick="sendFeedback(this,'negative',${msgIdx})">👎</button>`;
                div.appendChild(fb);
            }
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
        }
        async function sendFeedback(btn, rating, msgIdx) {
            const row = btn.parentElement;
            row.querySelectorAll('.feedback-btn').forEach(b => b.classList.remove('active-pos','active-neg'));
            btn.classList.add(rating==='positive'?'active-pos':'active-neg');
            const chunkIds = lastSources.map(s => s.chunk_id).filter(Boolean);
            try {
                await fetch('/api/query/feedback', {
                    method:'POST', headers:getHeaders(),
                    body: JSON.stringify({ session_id:currentSessionId, message_index:msgIdx, rating, source_chunk_ids:chunkIds })
                });
            } catch(e) {}
        }

        let msgCount = 0;
        async function askQuestion() {
            const question = questionEl.value.trim();
            if (!question || !apiKeyEl.value.trim()) return;
            addMessage(question, 'user');
            questionEl.value = ''; sendBtn.disabled = true;
            try {
                const body = { question, top_k: 5 };
                if (currentSessionId) body.session_id = currentSessionId;
                const res = await fetch('/api/query', { method:'POST', headers:getHeaders(), body:JSON.stringify(body) });
                if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.detail||`HTTP ${res.status}`); }
                const data = await res.json();
                currentSessionId = data.session_id;
                lastSources = data.sources || [];
                msgCount++;
                addMessage(data.answer, 'assistant', data.sources, data.date_filter, msgCount);
                updateIndicator(); loadSessions();
            } catch(err) { addMessage(`Errore: ${err.message}`, 'error'); }
            finally { sendBtn.disabled = false; questionEl.focus(); }
        }

        // Digests
        async function loadDigests() {
            const key = apiKeyEl.value.trim(); if (!key) return;
            const el = document.getElementById('digest-list');
            try {
                const res = await fetch('/api/digest?days=14', { headers:getHeaders() });
                if (!res.ok) return;
                const data = await res.json();
                let html = '<div class="digest-generate" style="padding:0.5rem"><button onclick="generateTodayDigest()">📊 Genera digest di oggi</button></div>';
                if (!data.items.length) html += '<div class="empty-state">Nessun digest.</div>';
                else html += data.items.map(d => `
                    <div class="digest-item" onclick="showDigest('${d.digest_date}')">
                        <div class="title">📊 ${new Date(d.digest_date+'T00:00:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})}</div>
                        <div class="meta">${d.conversation_count} conv · ${d.people.length} persone</div>
                    </div>`).join('');
                el.innerHTML = html;
            } catch(e) {}
        }
        async function showDigest(date) {
            try {
                const res = await fetch(`/api/digest/${date}`, { headers:getHeaders() });
                if (!res.ok) return;
                renderDigestPanel(await res.json());
            } catch(e) {}
        }
        function renderDigestPanel(d) {
            const panel = document.getElementById('digest-panel');
            const dateStr = new Date(d.digest_date+'T00:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
            let sections = '';
            if (d.people.length) sections += `<div class="digest-section"><h3>👤 Persone</h3><ul>${d.people.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`;
            if (d.tasks.length) sections += `<div class="digest-section"><h3>✅ Task</h3><ul>${d.tasks.map(t=>`<li>${esc(t.name||t)}</li>`).join('')}</ul></div>`;
            if (d.ideas.length) sections += `<div class="digest-section"><h3>💡 Idee</h3><ul>${d.ideas.map(i=>`<li>${esc(i.name||i)}</li>`).join('')}</ul></div>`;
            if (d.events.length) sections += `<div class="digest-section"><h3>📅 Eventi</h3><ul>${d.events.map(e=>`<li>${esc(e.name||e)}</li>`).join('')}</ul></div>`;
            panel.innerHTML = `
                <button class="back-btn" onclick="closeDigest()">← Chat</button>
                <h2>📊 ${dateStr}</h2>
                <p style="font-size:0.78rem;color:var(--text-tertiary);margin-bottom:1rem">${d.conversation_count} conversazioni</p>
                <div class="digest-summary">${esc(d.summary)}</div>${sections}`;
            document.getElementById('chat-container').classList.add('hidden');
            document.getElementById('detail-panel').classList.remove('active');
            panel.classList.add('active');
        }
        function closeDigest() { document.getElementById('digest-panel').classList.remove('active'); document.getElementById('chat-container').classList.remove('hidden'); }
        async function generateTodayDigest() {
            const today = new Date().toISOString().split('T')[0];
            try {
                const res = await fetch(`/api/digest/${today}`, { method:'POST', headers:getHeaders() });
                if (!res.ok) { alert((await res.json().catch(()=>({}))).detail||'Errore'); return; }
                renderDigestPanel(await res.json()); loadDigests();
            } catch(e) { alert(e.message); }
        }

        // Utils
        function fmtDate(iso) { return iso ? new Date(iso).toLocaleDateString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : ''; }
        function fmtTime(iso) { return iso ? new Date(iso).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}) : ''; }
        function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function updateIndicator() { document.getElementById('session-indicator').classList.toggle('hidden', !currentSessionId); }

        // Boot
        if (apiKeyEl.value.trim()) { loadSessions(); loadConversations(); }
    </script>
</body>
</html>
