<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo — Second Brain</title>
    <style>
        :root {
            --bg: #000000;
            --bg-sidebar: #0a0a0a;
            --bg-card: #141414;
            --bg-input: #1c1c1c;
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --text: #f5f5f7;
            --text-2: #a1a1a6;
            --text-3: #48484a;
            --accent: #0a84ff;
            --accent-h: #3a9fff;
            --green: #30d158;
            --yellow: #ffd60a;
            --red: #ff453a;
            --purple: #bf5af2;
            --r: 10px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;-webkit-font-smoothing:antialiased}

        /* SIDEBAR */
        #sidebar{width:280px;background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
        .s-header{padding:1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
        .s-header .brand{display:flex;align-items:center;gap:.5rem}
        .s-header h1{font-size:1rem;font-weight:600;letter-spacing:-.02em}
        .s-header .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(48,209,88,.5);animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        .btn-new{padding:.35rem .7rem;border-radius:6px;border:1px solid var(--border);background:0;color:var(--text-2);cursor:pointer;font-size:.72rem;transition:.2s}
        .btn-new:hover{border-color:var(--accent);color:var(--text)}

        /* TABS */
        .s-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 .25rem}
        .s-tab{flex:1;padding:.6rem .2rem;text-align:center;cursor:pointer;font-size:.7rem;color:var(--text-3);border-bottom:2px solid transparent;transition:.2s}
        .s-tab:hover{color:var(--text-2)}
        .s-tab.on{color:var(--text);border-bottom-color:var(--accent)}

        /* LISTS */
        .s-list{flex:1;overflow-y:auto;padding:.4rem}
        .s-item{padding:.6rem .75rem;border-radius:8px;cursor:pointer;margin-bottom:2px;transition:.15s}
        .s-item:hover{background:var(--bg-card)}
        .s-item.on{background:var(--accent)}
        .s-item .t{font-size:.8rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .s-item .m{font-size:.68rem;color:var(--text-3);margin-top:2px}
        .s-item.on .m{color:rgba(255,255,255,.6)}
        .s-item .x{float:right;opacity:0;cursor:pointer;font-size:.7rem;color:var(--text-3)}
        .s-item:hover .x{opacity:1}
        .s-item .x:hover{color:var(--red)}
        .empty{padding:2rem 1rem;color:var(--text-3);font-size:.82rem;text-align:center;line-height:1.5}
        .hidden{display:none!important}

        /* SETTINGS */
        .s-footer{padding:.6rem .75rem;border-top:1px solid var(--border);font-size:.72rem}
        .s-footer .row{display:flex;align-items:center;gap:.4rem;margin-bottom:.3rem}
        .s-footer input{flex:1;padding:.3rem .5rem;border-radius:6px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);font-size:.72rem;min-width:0;outline:0}
        .s-footer .btn-d{padding:.25rem .5rem;border-radius:5px;border:1px solid var(--border);background:0;color:var(--text-2);font-size:.68rem;cursor:pointer}
        .s-footer .btn-d:hover{border-color:var(--accent);color:var(--text)}
        .s-footer .hint{font-size:.68rem}
        .s-footer .hint.ok{color:var(--green)}
        .s-footer .hint.err{color:var(--red)}
        .s-footer .note{color:var(--text-3);font-size:.66rem;margin-top:.2rem}
        .s-footer a{color:var(--text-3);text-decoration:none;font-size:.68rem}
        .s-footer a:hover{color:var(--text-2)}

        /* MAIN */
        #main{flex:1;display:flex;flex-direction:column;overflow:hidden}
        .panel{flex:1;overflow-y:auto;padding:2rem;display:none}
        .panel.on{display:flex;flex-direction:column}

        /* CHAT */
        #p-chat{display:flex;flex-direction:column}
        #p-chat.on{display:flex}
        #chat{flex:1;overflow-y:auto;padding:0 0 1rem;display:flex;flex-direction:column;gap:.8rem}
        #chat:empty::after{content:"Ask your memory anything…";display:block;color:var(--text-3);font-size:1rem;padding:4rem 0;text-align:center}
        .msg{max-width:72%;padding:.8rem 1rem;border-radius:14px;line-height:1.55;font-size:.9rem;white-space:pre-wrap}
        .msg.user{align-self:flex-end;background:var(--accent);color:#fff}
        .msg.assistant{align-self:flex-start;background:var(--bg-card);border:1px solid var(--border)}
        .msg .src{margin-top:.4rem;padding-top:.4rem;border-top:1px solid var(--border);font-size:.72rem;color:var(--text-3)}
        .msg .df{font-size:.7rem;color:var(--purple);margin-top:.2rem}
        .msg .fb{margin-top:.4rem;display:flex;gap:.4rem}
        .fb-btn{background:0;border:1px solid var(--border);border-radius:6px;padding:.2rem .45rem;cursor:pointer;font-size:.75rem;color:var(--text-3);transition:.2s}
        .fb-btn:hover{border-color:var(--border-hover);color:var(--text)}
        .fb-btn.pos{border-color:var(--green);color:var(--green);background:rgba(48,209,88,.08)}
        .fb-btn.neg{border-color:var(--red);color:var(--red);background:rgba(255,69,58,.08)}
        .msg.err{align-self:center;background:rgba(255,69,58,.08);color:var(--red);font-size:.82rem;border:1px solid rgba(255,69,58,.15)}
        .typing{align-self:flex-start;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:.8rem 1.2rem;display:flex;gap:.3rem;align-items:center}
        .typing span{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:blink 1.4s infinite both}
        .typing span:nth-child(2){animation-delay:.2s}
        .typing span:nth-child(3){animation-delay:.4s}
        @keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
        .follow-ind{padding:.35rem 2rem;font-size:.7rem;color:var(--purple);border-bottom:1px solid var(--border);background:rgba(191,90,242,.03)}
        #input-bar{padding:1rem 2rem 1.25rem;border-top:1px solid var(--border);display:flex;gap:.6rem}
        #input-bar input{flex:1;padding:.75rem 1rem;border-radius:var(--r);border:1px solid var(--border);background:var(--bg-input);color:var(--text);font-size:.9rem;outline:0;transition:.2s}
        #input-bar input:focus{border-color:var(--accent)}
        #input-bar button{padding:.75rem 1.4rem;border-radius:var(--r);border:0;background:var(--accent);color:#fff;font-size:.9rem;cursor:pointer;font-weight:500;transition:.2s}
        #input-bar button:hover{background:var(--accent-h)}
        #input-bar button:disabled{background:var(--bg-card);color:var(--text-3);cursor:not-allowed}

        /* ENTITIES */
        .ent-bar{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
        .ent-bar select,.ent-bar input{padding:.4rem .6rem;border-radius:6px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);font-size:.8rem;outline:0}
        .ent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.6rem}
        .ent-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:.75rem 1rem;transition:.2s}
        .ent-card:hover{border-color:var(--border-hover)}
        .ent-card .top{display:flex;justify-content:space-between;align-items:center}
        .ent-card .name{font-size:.85rem;font-weight:500}
        .ent-card .type{font-size:.68rem;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.03em}
        .ent-card .type.person{background:rgba(10,132,255,.12);color:var(--accent)}
        .ent-card .type.task{background:rgba(255,214,10,.12);color:var(--yellow)}
        .ent-card .type.idea{background:rgba(48,209,88,.12);color:var(--green)}
        .ent-card .type.event{background:rgba(191,90,242,.12);color:var(--purple)}
        .ent-card .type.note{background:rgba(255,255,255,.05);color:var(--text-2)}
        .ent-card .content{font-size:.78rem;color:var(--text-2);margin-top:.4rem;line-height:1.4}
        .ent-card .actions{margin-top:.5rem;display:flex;gap:.4rem}
        .ent-card .actions button{background:0;border:1px solid var(--border);border-radius:5px;padding:.2rem .5rem;font-size:.7rem;cursor:pointer;color:var(--text-3);transition:.2s}
        .ent-card .actions button:hover{border-color:var(--border-hover);color:var(--text)}
        .ent-card .actions .del:hover{color:var(--red);border-color:var(--red)}

        /* STATS */
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.75rem;margin-bottom:2rem}
        .stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:1rem;text-align:center}
        .stat-card .num{font-size:1.8rem;font-weight:600;letter-spacing:-.03em}
        .stat-card .label{font-size:.72rem;color:var(--text-3);margin-top:.2rem;text-transform:uppercase;letter-spacing:.04em}

        /* DETAIL */
        .detail-panel{flex:1;overflow-y:auto;padding:2rem;display:none}
        .detail-panel.on{display:block}
        .back{padding:.35rem .7rem;border-radius:6px;border:1px solid var(--border);background:0;color:var(--text-2);cursor:pointer;font-size:.75rem;margin-bottom:1rem;transition:.2s}
        .back:hover{border-color:var(--accent);color:var(--text)}
        .d-title{font-size:1.2rem;font-weight:600;letter-spacing:-.02em;margin-bottom:.4rem}
        .d-summary{color:var(--text-2);font-size:.88rem;margin-bottom:1.5rem;line-height:1.5}
        .d-section{font-size:.75rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin:1.25rem 0 .5rem}
        .trans-item{padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.88rem;line-height:1.5}
        .trans-item .time{font-size:.7rem;color:var(--text-3)}
        .spk-self{color:var(--accent);font-weight:600;font-size:.7rem;margin-right:.3rem}
        .spk-other{color:var(--purple);font-weight:600;font-size:.7rem;margin-right:.3rem}
        .chip{display:inline-block;padding:.2rem .6rem;border-radius:14px;font-size:.72rem;margin:.15rem;border:1px solid var(--border)}
        .chip.person{border-color:rgba(10,132,255,.3);color:#64b5f6}
        .chip.task{border-color:rgba(255,214,10,.3);color:var(--yellow)}
        .chip.idea{border-color:rgba(48,209,88,.3);color:var(--green)}
        .chip.event{border-color:rgba(191,90,242,.3);color:var(--purple)}
        .chip.note{border-color:var(--border);color:var(--text-2)}
    </style>
</head>
<body>
<div id="sidebar">
    <div class="s-header"><div class="brand"><div class="dot"></div><h1>Echo</h1></div><button class="btn-new" onclick="newChat()">+ New</button></div>
    <div class="s-tabs">
        <div class="s-tab on" data-t="chat" onclick="tab('chat')">💬 Chat</div>
        <div class="s-tab" data-t="audio" onclick="tab('audio')">🎙 Audio</div>
        <div class="s-tab" data-t="entities" onclick="tab('entities')">🧠 Memory</div>
        <div class="s-tab" data-t="digest" onclick="tab('digest')">📊 Digest</div>
        <div class="s-tab" data-t="stats" onclick="tab('stats')">📈 Stats</div>
    </div>
    <div class="s-list" id="l-chat"></div>
    <div class="s-list hidden" id="l-audio"></div>
    <div class="s-list hidden" id="l-entities"></div>
    <div class="s-list hidden" id="l-digest"></div>
    <div class="s-list hidden" id="l-stats"></div>
    <div class="s-footer">
        <div class="row"><input id="api-key" placeholder="API key" autocomplete="off"/><button class="btn-d" onclick="useDefault()">Default</button></div>
        <div class="row"><span class="hint" id="ks"></span></div>
        <div class="note">Your Echo key, not OpenAI. <a href="/admin.html">Admin →</a></div>
    </div>
</div>
<div id="main">
    <!-- CHAT -->
    <div class="panel on" id="p-chat">
        <div class="follow-ind hidden" id="follow-ind">🔄 Follow-up active — context maintained</div>
        <div id="chat"></div>
        <div id="input-bar"><input id="q" placeholder="Ask your memory..." autofocus/><button id="send" onclick="ask()">Ask</button></div>
    </div>
    <!-- AUDIO DETAIL -->
    <div class="detail-panel" id="p-detail"></div>
    <!-- ENTITIES PAGE -->
    <div class="panel" id="p-entities"></div>
    <!-- DIGEST PAGE -->
    <div class="panel" id="p-digest"></div>
    <!-- STATS PAGE -->
    <div class="panel" id="p-stats"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const H=(t)=>(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const D=iso=>iso?new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const T=iso=>iso?new Date(iso).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}):'';
let sid=null,lastSrc=[],mc=0;

// INIT
const ak=$('api-key');
const stored=localStorage.getItem('echo_key')||'';
if(stored)ak.value=stored;
ak.addEventListener('change',boot);
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
function useDefault(){ak.value='my-secret-key';boot()}
function headers(){return{'X-API-Key':ak.value.trim(),'Content-Type':'application/json'}}
function boot(){localStorage.setItem('echo_key',ak.value.trim());loadChat();loadAudio()}

// TABS
function tab(t){
    document.querySelectorAll('.s-tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
    // Sidebar lists: only chat and audio have lists
    ['chat','audio','entities','digest','stats'].forEach(x=>{
        const el=$('l-'+x);if(el)el.classList.add('hidden');
    });
    if(t==='chat')$('l-chat').classList.remove('hidden');
    if(t==='audio')$('l-audio').classList.remove('hidden');
    // Main panels
    document.querySelectorAll('.panel,.detail-panel').forEach(x=>x.classList.remove('on'));
    if(t==='chat')$('p-chat').classList.add('on');
    if(t==='entities')loadEntities();
    if(t==='digest')loadDigests();
    if(t==='stats')loadStats();
    if(t==='audio')$('p-chat').classList.add('on'); // audio uses detail panel when clicked
}

// CHAT
async function loadChat(){
    if(!ak.value.trim()){$('l-chat').innerHTML='<div class="empty">Enter API key</div>';return}
    try{
        const r=await fetch('/api/chat-sessions',{headers:headers()});
        if(!r.ok){$('ks').className='hint err';$('ks').textContent='invalid';return}
        $('ks').className='hint ok';$('ks').textContent='connected';
        const d=await r.json();
        if(!d.items||!d.items.length){$('l-chat').innerHTML='<div class="empty">No chats yet.<br>Ask something!</div>';return}
        $('l-chat').innerHTML=d.items.map(s=>`<div class="s-item ${s.id===sid?'on':''}" onclick="loadSession('${s.id}')"><span class="x" onclick="event.stopPropagation();delSession('${s.id}')">✕</span><div class="t">${H(s.title||'Chat')}</div><div class="m">${D(s.updated_at)}</div></div>`).join('');
    }catch(e){$('l-chat').innerHTML='<div class="empty">Network error</div>'}
}
async function loadSession(id){
    sid=id;
    try{const r=await fetch(`/api/chat-sessions/${id}`,{headers:headers()});if(!r.ok)return;const d=await r.json();
    $('chat').innerHTML='';d.messages.forEach(m=>addMsg(m.content,m.role));
    $('follow-ind').classList.remove('hidden');loadChat();showPanel('chat');}catch(e){}
}
async function delSession(id){if(!confirm('Delete this chat?'))return;await fetch(`/api/chat-sessions/${id}`,{method:'DELETE',headers:headers()});if(sid===id)newChat();loadChat()}
function newChat(){sid=null;$('chat').innerHTML='';$('follow-ind').classList.add('hidden');loadChat()}

function addMsg(text,role,src,df,idx){
    const d=document.createElement('div');d.className=`msg ${role}`;d.textContent=text;
    if(src&&src.length){const s=document.createElement('div');s.className='src';s.textContent=`📎 ${src.length} sources`;d.appendChild(s)}
    if(df){const f=document.createElement('div');f.className='df';f.textContent=`📅 ${new Date(df.from).toLocaleDateString()} – ${new Date(df.to).toLocaleDateString()}`;d.appendChild(f)}
    if(role==='assistant'&&idx!==undefined){const fb=document.createElement('div');fb.className='fb';fb.innerHTML=`<button class="fb-btn" onclick="feedback(this,'positive',${idx})">👍</button><button class="fb-btn" onclick="feedback(this,'negative',${idx})">👎</button>`;d.appendChild(fb)}
    $('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;
}
async function feedback(btn,rating,idx){
    btn.parentElement.querySelectorAll('.fb-btn').forEach(b=>b.className='fb-btn');
    btn.classList.add(rating==='positive'?'pos':'neg');
    try{await fetch('/api/query/feedback',{method:'POST',headers:headers(),body:JSON.stringify({session_id:sid,message_index:idx,rating,source_chunk_ids:(lastSrc||[]).map(s=>s.chunk_id).filter(Boolean)})})}catch(e){}
}
async function ask(){
    const q=$('q').value.trim();if(!q||!ak.value.trim())return;
    addMsg(q,'user');$('q').value='';$('send').disabled=true;
    // Show typing indicator
    const typing=document.createElement('div');typing.className='typing';typing.id='typing-ind';
    typing.innerHTML='<span></span><span></span><span></span>';
    $('chat').appendChild(typing);$('chat').scrollTop=$('chat').scrollHeight;
    try{
        const body={question:q,top_k:5};if(sid)body.session_id=sid;
        const r=await fetch('/api/query',{method:'POST',headers:headers(),body:JSON.stringify(body)});
        if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||`HTTP ${r.status}`)}
        const d=await r.json();sid=d.session_id;lastSrc=d.sources||[];mc++;
        // Remove typing indicator
        typing.remove();
        addMsg(d.answer,'assistant',d.sources,d.date_filter,mc);
        $('follow-ind').classList.remove('hidden');loadChat();
    }catch(e){typing.remove();addMsg(`Error: ${e.message}`,'err')}
    finally{$('send').disabled=false;$('q').focus()}
}

// AUDIO
async function loadAudio(){
    if(!ak.value.trim())return;
    try{const r=await fetch('/api/conversations?limit=50',{headers:headers()});if(!r.ok)return;const d=await r.json();
    if(!d.conversations.length){$('l-audio').innerHTML='<div class="empty">No conversations yet.</div>';return}
    $('l-audio').innerHTML=d.conversations.map(c=>`<div class="s-item" onclick="showConv('${c.id}')"><div class="t">${H(c.title||'Untitled')}</div><div class="m">${D(c.started_at)} · ${c.segment_count} seg</div></div>`).join('')}catch(e){}
}
async function showConv(id){
    try{const r=await fetch(`/api/conversations/${id}`,{headers:headers()});if(!r.ok)return;const c=await r.json();
    const ents=c.entities.map(e=>`<span class="chip ${e.entity_type}">${H(e.name)}</span>`).join('');
    const trans=c.transcriptions.map(t=>{
        let spk='';const txt=t.text.replace(/^\[(Tu|Altri)\]\s*/,(m,s)=>{spk=s==='Tu'?'<span class="spk-self">[You]</span>':'<span class="spk-other">[Other]</span>';return''});
        return`<div class="trans-item"><span class="time">${T(t.recorded_at)}</span> ${spk}${H(txt)}</div>`}).join('');
    $('p-detail').innerHTML=`<button class="back" onclick="showPanel('chat')">← Back</button><div class="d-title">${H(c.title||'Conversation')}</div><div class="d-summary">${H(c.summary||'')}</div>${ents?'<div class="d-section">ENTITIES</div><div>'+ents+'</div>':''}<div class="d-section">TRANSCRIPTION</div>${trans||'<p style="color:var(--text-3)">No transcription.</p>'}`;
    showPanel('detail')}catch(e){}
}

// ENTITIES
async function loadEntities(){
    $('p-entities').classList.add('on');
    $('p-entities').innerHTML='<h2 style="font-size:1.1rem;font-weight:600;margin-bottom:1rem">Memory</h2><div class="ent-bar"><select id="ent-type"><option value="">All types</option><option value="person">People</option><option value="task">Tasks</option><option value="idea">Ideas</option><option value="event">Events</option><option value="note">Notes</option></select><input id="ent-search" placeholder="Search..." oninput="searchEnts()"/></div><div class="ent-grid" id="ent-grid"></div>';
    $('ent-type').addEventListener('change',searchEnts);
    searchEnts();
}
async function searchEnts(){
    const type=$('ent-type')?$('ent-type').value:'';
    const search=$('ent-search')?$('ent-search').value:'';
    let url=`/api/entities?limit=100`;
    if(type)url+=`&entity_type=${type}`;
    if(search)url+=`&search=${encodeURIComponent(search)}`;
    try{const r=await fetch(url,{headers:headers()});if(!r.ok)return;const d=await r.json();
    $('ent-grid').innerHTML=d.entities.map(e=>`<div class="ent-card"><div class="top"><span class="name">${H(e.name)}</span><span class="type ${e.entity_type}">${e.entity_type}</span></div>${e.content?`<div class="content">${H(e.content)}</div>`:''}<div class="actions"><button onclick="editEnt('${e.id}','${H(e.name)}')">✏️ Edit</button><button class="del" onclick="delEnt('${e.id}')">🗑️ Delete</button></div></div>`).join('')||'<div class="empty">No entities found.</div>'}catch(e){}
}
async function editEnt(id,name){const n=prompt('Name:',name);if(!n||n===name)return;await fetch(`/api/entities/${id}`,{method:'PATCH',headers:headers(),body:JSON.stringify({name:n})});searchEnts()}
async function delEnt(id){if(!confirm('Delete entity?'))return;await fetch(`/api/entities/${id}`,{method:'DELETE',headers:headers()});searchEnts()}

// DIGESTS
async function loadDigests(){
    $('p-digest').classList.add('on');
    try{const r=await fetch('/api/digest?days=14',{headers:headers()});if(!r.ok)return;const d=await r.json();
    let html='<h2 style="font-size:1.1rem;font-weight:600;margin-bottom:1rem">Daily Digests</h2>';
    if(!d.items.length)html+='<div class="empty">No digests yet.</div>';
    else html+=d.items.map(x=>`<div class="s-item" onclick="showDigest('${x.digest_date}')" style="margin-bottom:.5rem"><div class="t">📊 ${new Date(x.digest_date+'T00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</div><div class="m">${x.conversation_count} conversations · ${x.people.length} people</div></div>`).join('');
    $('p-digest').innerHTML=html}catch(e){}
}
async function showDigest(date){
    try{const r=await fetch(`/api/digest/${date}`,{headers:headers()});if(!r.ok)return;const d=await r.json();
    const ds=new Date(d.digest_date+'T00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
    let sec='';
    if(d.people.length)sec+=`<div class="d-section">👤 PEOPLE</div><p style="color:var(--text-2);font-size:.85rem">${d.people.join(', ')}</p>`;
    if(d.tasks.length)sec+=`<div class="d-section">✅ TASKS</div>${d.tasks.map(t=>`<p style="color:var(--text-2);font-size:.85rem">• ${H(t.name||t)}</p>`).join('')}`;
    if(d.ideas.length)sec+=`<div class="d-section">💡 IDEAS</div>${d.ideas.map(i=>`<p style="color:var(--text-2);font-size:.85rem">• ${H(i.name||i)}</p>`).join('')}`;
    $('p-digest').innerHTML=`<button class="back" onclick="loadDigests()">← Back</button><div class="d-title">📊 ${ds}</div><div class="d-summary">${H(d.summary)}</div>${sec}`}catch(e){}
}

// STATS
async function loadStats(){
    $('p-stats').classList.add('on');
    try{const r=await fetch('/api/stats',{headers:headers()});if(!r.ok)return;const d=await r.json();
    const r2=await fetch('/api/entities/stats',{headers:headers()});const es=r2.ok?await r2.json():{total:0,by_type:[]};
    $('p-stats').innerHTML=`<h2 style="font-size:1.1rem;font-weight:600;margin-bottom:1.5rem">System Stats</h2>
    <div class="stats-grid">
        <div class="stat-card"><div class="num">${d.segments}</div><div class="label">Segments</div></div>
        <div class="stat-card"><div class="num">${d.transcriptions}</div><div class="label">Transcriptions</div></div>
        <div class="stat-card"><div class="num">${d.conversations}</div><div class="label">Conversations</div></div>
        <div class="stat-card"><div class="num">${es.total}</div><div class="label">Entities</div></div>
        <div class="stat-card"><div class="num">${d.chunks}</div><div class="label">Chunks</div></div>
        <div class="stat-card"><div class="num">${d.audio_storage_mb} MB</div><div class="label">Audio Storage</div></div>
    </div>
    ${es.by_type.length?'<div class="d-section">ENTITIES BY TYPE</div><div class="stats-grid">'+es.by_type.map(t=>`<div class="stat-card"><div class="num">${t.count}</div><div class="label">${t.entity_type}</div></div>`).join('')+'</div>':''}`;
    }catch(e){$('p-stats').innerHTML='<div class="empty">Could not load stats.</div>'}
}

// HELPERS
function showPanel(p){
    document.querySelectorAll('.panel,.detail-panel').forEach(x=>x.classList.remove('on'));
    if(p==='chat')$('p-chat').classList.add('on');
    else if(p==='detail')$('p-detail').classList.add('on');
    else if(p==='entities'){$('p-entities').classList.add('on');loadEntities();}
    else if(p==='digest'){$('p-digest').classList.add('on');loadDigests();}
    else if(p==='stats'){$('p-stats').classList.add('on');loadStats();}
}

// BOOT
if(ak.value.trim())boot();
</script>
</body>
</html>
