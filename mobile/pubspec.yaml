name: echo_app
description: Echo — Second Brain AI Wearable companion app
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.2.0
  flutter_blue_plus: ^2.3.14
  connectivity_plus: 6.1.5
  flutter_local_notifications: 18.0.1
  timezone: 0.9.4
  url_launcher: ^6.2.0
  speech_to_text: ^7.0.0
  flutter_markdown: ^0.7.4+3
  # Wall-clock time the widget tests can advance (already in the lock through flutter)
  clock: ^1.1.1
  crypto: ^3.0.3
  # The offline copy of the last responses (already in the lock through other plugins)
  path_provider: ^2.1.5
  # The iOS share sheet: a conversation as text, the data export as a file
  share_plus: 13.3.0
  # The phone's camera when the wearable cannot take the photo (Ask's camera button)
  image_picker: 1.1.2
  # The phone's place and its address, read only when the user saves something with it
  geolocator: 14.1.2
  # 4.x: 5.x needs a newer Swift than the Xcode in use (its Package.swift)
  geocoding: 4.0.0
  flutter_tts: 4.2.5
  file_picker: 13.3.0
  # Spoken answers in Echo's natural voices (Plus): the server's MP3, played with other
  # sound lowered meanwhile (audio_session)
  just_audio: 0.10.4
  audio_session: 0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-Archivo.txt
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
    # Archivo at 116% width, for screen and panel titles
    - family: Archivo Expanded
      fonts:
        - asset: assets/fonts/ArchivoExpanded-Bold.ttf
          weight: 700
