name: echo_app
description: Echo — Second Brain AI Wearable companion app
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.2.0
  flutter_blue_plus: ^2.3.14
  connectivity_plus: 6.1.5
  flutter_local_notifications: 18.0.1
  timezone: 0.9.4
  url_launcher: ^6.2.0
  speech_to_text: ^7.0.0
  flutter_markdown: ^0.7.4+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
