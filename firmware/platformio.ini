[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; Firmware updates hash and write flash on the NimBLE host task (ble_transport.h)
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@2.3.2
    ; Firmware updates are signed: ECDSA P-256 checked by ota_signature.h
    kmackay/micro-ecc@1.0.0

[env:native]
platform = native
test_framework = unity
test_build_src = false
build_flags = -std=c++11
; micro-ecc ships as an Arduino library: plain C, it builds here too
lib_compat_mode = off
lib_deps =
    kmackay/micro-ecc@1.0.0
