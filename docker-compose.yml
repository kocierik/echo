services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # This machine only: the tunnel reaches api over the compose network, and a port open
      # to the LAN would let clients forge CF-Connecting-IP (used by the auth failure limit)
      - "127.0.0.1:8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://echo:echo@postgres:5432/echo
      - REDIS_URL=redis://redis:6379/0
      - AUDIO_STORAGE_PATH=/data/audio
      - COMPLETED_AUDIO_RETENTION_HOURS=24
      - INCOMPLETE_AUDIO_RETENTION_DAYS=7
    volumes:
      - ./backend:/app
      - audio_data:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.workers.main
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://echo:echo@postgres:5432/echo
      - REDIS_URL=redis://redis:6379/0
      - AUDIO_STORAGE_PATH=/data/audio
      - COMPLETED_AUDIO_RETENTION_HOURS=24
      - INCOMPLETE_AUDIO_RETENTION_DAYS=7
    volumes:
      - ./backend:/app
      - audio_data:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: echo
      POSTGRES_DB: echo
    ports:
      - "127.0.0.1:5432:5432"  # this machine only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"  # this machine only
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # WhatsApp, read-only (whatsapp/): only with COMPOSE_PROFILES=whatsapp in .env. Its port
  # is not published: api and worker reach it as http://whatsapp:3100 with the token
  whatsapp:
    build:
      context: ./whatsapp
    profiles: ["whatsapp"]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    volumes:
      # The linked devices' keys; the messages stay in memory only
      - whatsapp_data:/data
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  audio_data:
  whatsapp_data:
